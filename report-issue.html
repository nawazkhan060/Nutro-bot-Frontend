<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Report Issue | Nutron Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css?v=2.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z">
                    </path>
                </svg>
                Nutron-bot
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </span> Chat
                </a>
                <a href="about.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </span> About
                </a>
                <a href="contact.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span> Contact
                </a>
                <a href="feedback.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3">
                            </path>
                        </svg>
                    </span> Feedback
                </a>
                <a href="report-issue.html" class="active">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                            </path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </span> Report Issue
                </a>
            </nav>
            <div class="pro-tip-card">
                <div class="tip-title">Pro Tip</div>
                <div class="tip-content">Reporting bugs helps us build a better AI for you!</div>
            </div>
        </aside>

        <section class="chat-section">
            <div class="report-container animate-fade-in">
                <div class="about-icon-main" style="width: 56px; height: 56px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <h1>Report an Issue</h1>
                <p class="subtitle">Found a bug? Help us squash it! Describe what happened below.</p>

                <form onsubmit="alert('Thank you for your report!'); return false;">
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>

                    <div class="issue-types">
                        <label>
                            <input type="radio" name="it" required>
                            <span class="issue-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M8 2v4"></path>
                                    <path d="M16 2v4"></path>
                                    <path d="M2 13h20"></path>
                                    <path d="M6 7l12 0"></path>
                                    <path d="M6 7v13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"></path>
                                    <path d="M20 9l-2 2"></path>
                                    <path d="M4 9l2 2"></path>
                                </svg>
                            </span>
                            Bug Report
                        </label>
                        <label>
                            <input type="radio" name="it">
                            <span class="issue-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M12 2v2"></path>
                                    <path d="m4.93 4.93 1.41 1.41"></path>
                                    <path d="M2 12h2"></path>
                                    <path d="m4.93 19.07 1.41-1.41"></path>
                                    <path d="M12 20v2"></path>
                                    <path d="m17.66 17.66 1.41 1.41"></path>
                                    <path d="M20 12h2"></path>
                                    <path d="m17.66 6.34 1.41-1.41"></path>
                                    <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"></path>
                                </svg>
                            </span>
                            App Crash
                        </label>
                        <label>
                            <input type="radio" name="it">
                            <span class="issue-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                                </svg>
                            </span>
                            Performance
                        </label>
                        <label>
                            <input type="radio" name="it">
                            <span class="issue-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                                    <path d="M2 2l5 5"></path>
                                    <path d="m9.5 9.5 1 1"></path>
                                </svg>
                            </span>
                            UI/UX Issue
                        </label>
                    </div>

                    <select required>
                        <option value="" disabled selected>Severity Level</option>
                        <option value="critical">Critical - App doesn't work</option>
                        <option value="high">High - Major feature broken</option>
                        <option value="medium">Medium - Minor issue</option>
                    </select>

                    <textarea rows="5" placeholder="Describe the issue in detail..." required></textarea>

                    <div class="severity-info">
                        <strong>Tips for better reports:</strong>
                        Include steps to reproduce • Mention your browser/device
                    </div>

                    <button type="submit">Submit Bug Report</button>
                </form>
                <p style="margin-top:24px;"><a href="index.html"
                        style="color:var(--brand-primary); text-decoration:none;">Back to Chat</a></p>
            </div>
        </section>
    </div>
    <script src="../javascript/script.js"></script>
</body>

</html>
