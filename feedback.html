<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Feedback | Nutron Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css?v=2.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z">
                    </path>
                </svg>
                Nutron-bot
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </span> Chat
                </a>
                <a href="about.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </span> About
                </a>
                <a href="contact.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span> Contact
                </a>
                <a href="feedback.html" class="active">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3">
                            </path>
                        </svg>
                    </span> Feedback
                </a>
                <a href="report-issue.html">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                            </path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </span> Report Issue
                </a>
            </nav>
            <div class="pro-tip-card">
                <div class="tip-title">Pro Tip</div>
                <div class="tip-content">Your feedback helps us grow! Don't hesitate to share your thoughts.</div>
            </div>
        </aside>

        <section class="chat-section">
            <div class="contact-container animate-fade-in">
                <div class="about-icon-main" style="width: 56px; height: 56px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3">
                        </path>
                    </svg>
                </div>
                <h1>User Feedback</h1>
                <p>We'd love to hear your thoughts on how we can improve Nutron-bot.</p>

                <form onsubmit="alert('Thank you for your feedback!'); return false;">
                    <div class="rating-box" style="margin-bottom: 24px;">
                        <p style="margin-bottom: 12px; font-weight: 600;">How would you rate your experience?</p>
                        <div style="display: flex; justify-content: center; gap: 12px;">
                            <button type="button" class="rating-btn"
                                onclick="this.parentElement.querySelectorAll('.rating-btn').forEach(b=>b.style.borderColor='var(--border-color)'); this.style.borderColor='var(--brand-primary)';"
                                style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 15px; border-radius: var(--radius-sm); cursor: pointer;">1</button>
                            <button type="button" class="rating-btn"
                                onclick="this.parentElement.querySelectorAll('.rating-btn').forEach(b=>b.style.borderColor='var(--border-color)'); this.style.borderColor='var(--brand-primary)';"
                                style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 15px; border-radius: var(--radius-sm); cursor: pointer;">2</button>
                            <button type="button" class="rating-btn"
                                onclick="this.parentElement.querySelectorAll('.rating-btn').forEach(b=>b.style.borderColor='var(--border-color)'); this.style.borderColor='var(--brand-primary)';"
                                style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 15px; border-radius: var(--radius-sm); cursor: pointer;">3</button>
                            <button type="button" class="rating-btn"
                                onclick="this.parentElement.querySelectorAll('.rating-btn').forEach(b=>b.style.borderColor='var(--border-color)'); this.style.borderColor='var(--brand-primary)';"
                                style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 15px; border-radius: var(--radius-sm); cursor: pointer;">4</button>
                            <button type="button" class="rating-btn"
                                onclick="this.parentElement.querySelectorAll('.rating-btn').forEach(b=>b.style.borderColor='var(--border-color)'); this.style.borderColor='var(--brand-primary)';"
                                style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 15px; border-radius: var(--radius-sm); cursor: pointer;">5</button>
                        </div>
                    </div>

                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>

                    <select required>
                        <option value="" disabled selected>Category</option>
                        <option value="ui">User Interface</option>
                        <option value="performance">Performance</option>
                        <option value="accuracy">AI Accuracy</option>
                        <option value="feature">Feature Request</option>
                        <option value="other">Other</option>
                    </select>

                    <textarea rows="4" placeholder="Tell us more..." required></textarea>

                    <button type="submit">Submit Feedback</button>
                </form>

                <p style="margin-top:24px;"><a href="index.html"
                        style="color:var(--brand-primary); text-decoration:none;">Back to Chat</a></p>
            </div>
        </section>
    </div>
    <script src="../javascript/script.js"></script>
</body>

</html>
