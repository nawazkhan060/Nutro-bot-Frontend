<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>404 - Not Found | Nutron Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css?v=2.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <style>
        .error-page {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-content {
            text-align: center;
            max-width: 500px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--brand-primary), #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 24px;
            text-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .error-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 1.1rem;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: var(--brand-primary);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-content animate-fade-in">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-subtitle">The page you're looking for was either moved, deleted, or never existed in the
                first place.</p>
            <a href="index.html" class="home-btn">Return to Chat</a>
        </div>
    </div>
</body>

</html>
